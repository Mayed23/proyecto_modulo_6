{% extends "core/base.html" %}
{% block title %}Eliminar Proyecto{% endblock %}

{% block content %}
<h2>Eliminar Proyecto</h2>
<p>¿Estás seguro de que quieres eliminar el proyecto <strong>"{{ object.nombre }}"</strong>?</p>
<p class="text-danger">Esta acción también eliminará todas sus tareas asociadas.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'proyecto_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
