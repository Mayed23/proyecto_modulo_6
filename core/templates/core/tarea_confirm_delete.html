{% extends "core/base.html" %}
{% block title %}Eliminar Tarea{% endblock %}

{% block content %}
<h2>Eliminar Tarea</h2>
<p>¿Estás seguro de que quieres eliminar la tarea <strong>"{{ object.titulo }}"</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'tarea_list' object.proyecto_id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
